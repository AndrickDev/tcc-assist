# Configuração Fly.io para o serviço FastAPI do Teseo.
# Decisão de host: BL-007 (Fly.io). Região GRU (São Paulo) para latência BR.
#
# App de produção: `teseo-ai`.
# Secrets obrigatórios:
#   flyctl secrets set INTERNAL_JWT_SECRET=... GOOGLE_API_KEY=... REDIS_URL=... POSTGRES_URL=...
# Deploy:
#   flyctl deploy --remote-only

app = "teseo-ai"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
