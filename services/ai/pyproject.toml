[project]
name = "tcc-assist-ai"
version = "0.1.0"
description = "FastAPI AI/RAG service for Teseo / TCC-Assist."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pgvector>=0.3",
    "pypdf>=4.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9.0",
    "pyjwt>=2.9",
    "redis>=5.0.0,<6",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.21.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "reportlab>=4.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.21.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "reportlab>=4.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdf"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
